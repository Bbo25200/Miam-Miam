/* Miam Miam — rafraîchissement visuel uniquement, logique inchangée */
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#352820;background:#fffaf2}
body{background:linear-gradient(180deg,#fff4df 0,#fffaf2 230px);min-height:100vh}
header{background:rgba(255,250,242,.97);border-bottom:1px solid #f0dfca;padding:15px 19px;box-shadow:0 3px 18px rgba(98,59,29,.04)}
header strong{font-size:25px;font-weight:800;letter-spacing:-.7px;color:#793c27}
header button:first-child{background:#ffebcd;border-radius:15px;width:46px;height:46px;font-size:25px}
header button:last-child{background:#fff0dc;border-radius:15px;width:46px;height:46px;font-size:23px}
main{padding:22px 18px 125px;max-width:650px}
h2{font-size:27px;letter-spacing:-.8px;color:#613724;margin:7px 0 20px}
h3{color:#74432e;font-size:18px}
.card{border:1px solid #f0e1d1;border-radius:19px;padding:18px;box-shadow:0 5px 20px rgba(91,55,27,.045)}
.item{background:#fff;border:1px solid #f1e5d7;border-radius:13px;margin:9px 0;padding:14px 13px;box-shadow:0 2px 9px rgba(91,55,27,.035)}
.item button:first-child{font-weight:600;color:#493227}
.primary{background:#a95435;color:#fff;padding:13px 18px;border-radius:13px;box-shadow:0 4px 12px rgba(169,84,53,.17)}
.secondary{background:#f7e8d7;color:#77432e;padding:12px 14px;border-radius:12px}
input,select,textarea{border:1px solid #e5d3bf;border-radius:12px;padding:13px;background:#fff;outline-color:#c98158}
label{color:#624638;font-weight:650}
.muted{color:#8a7669}
.alphabet{gap:6px;margin:13px 0 17px}
.alphabet button{background:#fff;border:1px solid #eedbc5;border-radius:9px;padding:8px 9px;color:#8b5239;font-weight:650}
.pill{background:#fff0db;color:#8e4e31;padding:5px 10px}
.tabs{background:rgba(255,255,255,.98);border-top:1px solid #f0e2d3;padding:10px 3px max(12px,env(safe-area-inset-bottom));box-shadow:0 -5px 22px rgba(73,42,20,.045)}
.tabs button{font-size:10px;color:#8e7d70;gap:5px}
.tabs .ico{font-size:23px}
.tabs .active{color:#a95435;font-weight:800}
@media(max-width:390px){main{padding-left:13px;padding-right:13px}.tabs button{font-size:9px}.tabs .ico{font-size:21px}}
/* Barre de navigation inspirée de la maquette */
.tabs{padding:9px 5px max(10px,env(safe-area-inset-bottom));gap:2px}
.tabs button{color:#45291d;font-size:10px;gap:5px;border-radius:17px;min-width:0;padding:9px 1px 7px;font-weight:500}
.tabs .ico{height:32px;display:flex;align-items:center;justify-content:center}
.tabs .ico svg{display:block;width:29px;height:29px}
.tabs button.active{background:#f59a08;color:#fff;font-weight:700}
@media(max-width:390px){.tabs button{font-size:9px}.tabs .ico svg{width:26px;height:26px}}

/* En-tête inspiré de la maquette, sans modification des fonctions */
header{display:grid;grid-template-columns:64px minmax(0,1fr) 54px;align-items:center;gap:4px;padding:12px 13px 9px;min-height:91px}
header button:first-child,header button:last-child{background:transparent;border-radius:0;width:auto;height:auto;padding:0}
header .home-logo{display:flex;align-items:center;justify-content:center;width:64px;height:69px}
header .home-logo svg{display:block;width:62px;height:68px}
header .brand-title{position:relative;text-align:center;white-space:nowrap;font-size:clamp(25px,7.4vw,38px);font-weight:900;letter-spacing:-1.6px;color:#4b210f;line-height:1.1;padding-bottom:9px}
header .brand-title:after{content:"";position:absolute;bottom:1px;left:20%;right:15%;height:5px;border-radius:80% 20% 65% 35%;background:#f39a0b;transform:rotate(-1deg)}
header .cart-logo{display:flex;align-items:center;justify-content:center;width:50px;height:56px;color:#4b210f}
header .cart-logo svg{width:43px;height:43px;display:block}
@media(max-width:370px){header{grid-template-columns:52px minmax(0,1fr) 42px;padding-left:8px;padding-right:8px}header .home-logo{width:52px}header .home-logo svg{width:51px}header .cart-logo{width:42px}header .cart-logo svg{width:38px}header .brand-title{font-size:26px}}

/* Recherche façon maquette — recettes uniquement */
.recipe-search-row{display:flex;align-items:center;gap:12px;margin:6px 0 22px}
.recipe-search-box{height:54px;flex:1;min-width:0;border:1.5px solid #cbb7a2;border-radius:32px;background:#fff;display:flex;align-items:center;padding:0 16px;gap:11px}
.recipe-search-box svg{width:23px;height:23px;flex-shrink:0;color:#777}
.recipe-search-box #search{width:100%;min-width:0;border:0;outline:0;background:transparent;padding:0;font-size:16px;box-shadow:none}
.recipe-add{width:55px;height:55px;flex-shrink:0;border-radius:50%;background:#f59a08;color:white;font-size:43px;font-weight:300;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 0 5px;box-shadow:0 3px 9px #d89a3440}
.recipe-search-box:focus-within{border-color:#f59a08}

.recipe-categories{display:flex;gap:9px;overflow-x:auto;padding:2px 1px 12px;margin:0 0 9px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.recipe-categories::-webkit-scrollbar{display:none}
.recipe-categories button{white-space:nowrap;flex-shrink:0;background:#fff0dc;color:#42271b;border-radius:22px;padding:11px 16px;font-size:14px;font-weight:600;box-shadow:0 2px 5px #8c542012}
.recipe-categories button.active{background:#f59a08;color:#fff}

/* Alphabet vertical à droite de la liste des recettes */
.recipe-list-shell{position:relative;padding-right:30px}
.recipe-list-shell .alphabet{position:fixed;right:max(6px,calc((100vw - 650px)/2 + 6px));top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;flex-wrap:nowrap;align-items:center;gap:0;margin:0;padding:3px 1px;background:rgba(255,250,242,.95);border-radius:9px;max-height:calc(100dvh - 170px);overflow-y:auto;scrollbar-width:none}
.recipe-list-shell .alphabet button{width:24px;min-height:clamp(13px,2.1dvh,19px);padding:0;border:0;border-radius:3px;background:transparent;color:#4b291c;font-size:clamp(10px,1.45dvh,13px);font-weight:650;line-height:1}
.recipe-list-shell .alphabet button:last-child{font-size:8px;min-height:19px}
.recipe-list-shell .alphabet button:active{background:#f59a08;color:#fff}
/* Colonne A-Z affinée et espace de sécurité avec les filtres */
.recipe-list-shell .alphabet{right:max(3px,calc((100vw - 650px)/2 + 3px));width:18px;padding:3px 0}
.recipe-list-shell .alphabet button{width:18px;font-size:clamp(9px,1.35dvh,12px)}
.recipe-categories{width:calc(100% - 30px);max-width:100%;margin-right:30px}
.recipe-list-shell #results{padding-right:24px}

/* Fiche recette — consultation */
.recipe-detail-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin:18px 0}.recipe-detail-head h2{margin:4px 0 8px;font-size:29px}.recipe-detail-meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 18px}.recipe-detail-meta span{background:#fff0dc;border-radius:20px;padding:7px 11px;font-size:13px;color:#71412b}.recipe-detail-card{background:#fff;border:1px solid #f0e1d1;border-radius:19px;padding:18px;margin:13px 0;box-shadow:0 4px 18px #5b371b0b}.recipe-detail-card h3{margin:0 0 14px;font-size:19px}.recipe-people{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff4e3;padding:12px;border-radius:13px}.recipe-people-controls{display:flex;align-items:center;gap:12px;font-weight:800}.recipe-people-controls button{width:34px;height:34px;background:#f59a08;color:white;border-radius:50%;font-size:24px;line-height:1}.recipe-ingredient{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #f2e8dd}.recipe-ingredient:last-child{border:0}.recipe-ingredient b{white-space:nowrap;color:#7b4029}.recipe-steps{white-space:pre-line;line-height:1.7;color:#4b372c}.recipe-detail-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.recipe-detail-actions button{flex:1;min-width:125px}

/* Éditeur de recettes */
.recipe-photo{display:block;width:100%;max-height:270px;object-fit:cover;border-radius:16px;margin:10px 0}
.recipe-editor-section{background:#fff;border:1px solid #f0e1d1;border-radius:17px;padding:15px;margin:13px 0}
.recipe-editor-section h3{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.mini-add{background:#f59a08;color:white;border-radius:50%;width:36px;height:36px;font-size:26px;line-height:1}
.editor-entry{display:flex;align-items:center;gap:8px;border-bottom:1px solid #f0e5da;padding:10px 0}
.editor-entry span{flex:1;min-width:0;overflow-wrap:anywhere}
.editor-entry button{background:#f7e8d7;border-radius:9px;padding:8px}
.recipe-modal-backdrop{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}
.recipe-modal{background:#fffaf2;border-radius:18px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.recipe-modal h3{margin-top:0}.recipe-modal select{width:100%}.recipe-modal .row{margin-top:16px}
.recipe-ingredient button{background:#fff0dc;border-radius:9px;padding:7px;font-size:20px}
.recipe-ingredient span{flex:1}.recipe-ingredient b{white-space:normal;text-align:right}
.recipe-step{display:flex;gap:12px;margin:12px 0;line-height:1.6}.recipe-step-number{flex:none;background:#f59a08;color:white;border-radius:50%;width:29px;height:29px;text-align:center;line-height:29px;font-weight:bold}
.spice-item{display:flex;align-items:center;gap:11px}
.spice-dot{width:12px;height:12px;min-width:12px;border-radius:50%;display:inline-block}
.spice-in{background:#27944b}
.spice-out{background:#dc3d3d}
.spice-item .spice-cart{flex:none;background:#fff0dc;border-radius:10px;padding:9px;font-size:20px}
.season-month{background:white;border:1px solid #f0e1d1;border-radius:14px;margin:9px 0;overflow:hidden}
.season-month-button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:17px 18px;font-size:17px;font-weight:700;color:#613724;text-align:left}
.season-content{padding:0 16px 18px;border-top:1px solid #f3e8dd}
.season-content h3{margin:18px 0 10px}
.season-tags{display:flex;flex-wrap:wrap;gap:8px}
.season-tags span{background:#fff1df;border-radius:20px;padding:8px 11px;font-size:14px}

.preparation-step{display:flex;align-items:flex-start;gap:9px;margin:12px 0}.preparation-step .recipe-step-number{margin-top:8px}.preparation-step textarea{flex:1;min-width:0;resize:vertical}.preparation-step button{margin-top:5px;padding:10px}

.theme-choice{display:flex;align-items:center;justify-content:space-between;gap:12px}
.theme-choice select{width:auto;max-width:60%}
 .course-list-option{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border-radius:12px;background:#fff0dc;color:#42271b;font-weight:650}
html[data-theme="dark"] .course-list-option{background:#493628;color:#ffdab0}

/* Ajouts novembre 2026 */
.category-chip{display:inline-block;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:700;white-space:nowrap;background:var(--chip-bg,#eee);color:var(--chip-color,#333)}

.meal-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.meal-slot{border:1px solid #e9ddce;border-radius:13px;padding:11px;background:#fff}.meal-slot select{width:100%;max-width:100%;margin-top:7px}.meal-slot .row{margin-top:8px}.meal-slot input{width:64px;padding:7px}.meal-day{grid-column:1/-1;margin-top:8px;font-weight:800;color:#a95435}.voice-field{display:flex;align-items:center;gap:6px}.voice-field input,.voice-field textarea{flex:1}.voice-button{background:#f7e8d7;border-radius:10px;padding:9px;font-size:19px}

function addCocktailIngredientToCourses(j){
 let r=db.cocktails.find(x=>x.id===detailId),i=r?.ingredients?.[j];if(!i)return;

 chooseCourseList([{nom:i.nom,qte,unite:i.unite}]);
}

n>${Array.isArray(r.materiel)&&r.materiel.length?`<section class="recipe-detail-card"><h3>🍳 Matériel</h3>${r.materiel.map(v=>`<div class="recipe-step">${esc(v)}</div>`).join('')}</section>`:''}${r.notes?`<section class="recipe-detail-card"><h3>📝 Notes</h3><div class="recipe-steps">${esc(r.notes)}</div></section>`:''}<div class="recipe-detail-actions"><button class="secondary" onclick="printRecipe()">📄 Export PDF</button><button class="secondary" onclick="editId=detailId;recipeDraft=null;render();window.scrollTo(0,0)">✏️ Modifier</button></div>`}
function addIngredientToCourses(j){
 let r=db.recettes.find(x=>x.id===detailId),i=r?.ingredients?.[j];if(!i)return;
 let n=Math.max(1,Math.min(6,detailPeople)),qte=Math.round((Number(i.qte)||0)*n/(Number(r.personnes)||2)*100)/100;
 chooseCourseList([{nom:i.nom,qte,unite:i.unite}]);
}

function removeItem(kind,key){if(confirm('Supprimer cette fiche ?')){db[kind]=db[kind].filter(x=>x.id!==key);save();editId=null;render()}}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/s$/,'')}
function fridge(){app.innerHTML=`<h2>Mon frigo</h2><p class="muted">Indique les quantités disponibles, puis le nombre de convives. Les recettes ayant au moins 50 % des ingrédients disponibles sont proposées.</p><form id="addfridge" class="card"><label>Ingrédient</label><input name="nom" required placeholder="Ex. tomates"><div class="grid"><div><label>Quantité</label><input name="qte" type="number" step="any" min="0" required></div><div><label>Unité</label><input name="unite" placeholder="g, ml, pièce..."></div></div><p><button class="primary">+ Ajouter au frigo</button></p></form>${db.frigo.map(x=>`<div class="item"><span>${esc(x.nom)}${x.qte==null?'':' — '+x.qte+' '+esc(x.unite)}</span><button class="danger" onclick="db.frigo=db.frigo.filter(i=>i.id!=='${x.id}');save();render()">✕</button></div>`).join('')}<label>Nombre de personnes</label><input type="number" min="1" value="2" id="people"><p><button class="primary" onclick="matchRecipes()">Trouver des recettes</button></p><div id="matches"></div>`;document.getElementById('addfridge').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.frigo.push({id:id(),nom:f.get('nom').trim(),qte:Number(f.get('qte')),unite:f.get('unite').trim()});save();render()}}
function matchRecipes(){let n=Number(document.getElementById('people').value)||2;let hits=db.recettes.map(r=>{let missing=[],found=0;for(let i of r.ingredients){let needed=i.qte*n/(r.personnes||2),stock=db.frigo.filter(x=>norm(x.nom)===norm(i.nom)&&norm(x.unite)===norm(i.unite)).reduce((s,x)=>s+x.qte,0);if(stock>=needed)found++;else missing.push({...i,qte:Math.max(0,needed-stock)})}return{r,percent:r.ingredients.length?Math.round(100*found/r.ingredients.length):0,missing}}).filter(x=>x.percent>=50).sort((a,b)=>b.percent-a.percent);document.getElementById('matches').innerHTML=`<h3>Recettes compatibles</h3>${hits.map((x,j)=>`<div class="card"><strong>${esc(x.r.nom)}</strong> <span class="pill">${x.percent} %</span><p class="muted">${x.missing.length?'Manque : '+x.missing.map(i=>`${String(Number(i.qte.toFixed(2)))} ${esc(i.unite)} ${esc(i.nom)}`).join(', '):'Tous les ingrédients sont disponibles'}</p>${x.missing.length?`<button class="secondary" onclick="addMissing(${j})">Ajouter les manquants aux courses</button>`:''}</div>`).join('')||'<p>Aucune recette ne dépasse 50 %. Ajoute des ingrédients ou des recettes.</p>'}`;window.addMissing=j=>{chooseCourseList(hits[j].missing.map(i=>({nom:i.nom,qte:i.qte,unite:i.unite})))}}
function addSpiceToCourses(key){
 let spice=db.epices.find(x=>x.id===key);if(!spice)return;
 chooseCourseList([{nom:spice.nom,qte:null,unite:''}]);
}
function addCourseItems(items,listId){
 if(!db.courseLists.some(x=>x.id===listId))return;
 let added=0,skipped=0;items.forEach(x=>{let qty=x.qte??null;const stocks=db.frigo.filter(f=>norm(f.nom)===norm(x.nom)&&norm(f.unite)===norm(x.unite||''));if(qty!==null&&stocks.length){qty=Math.max(0,Number(qty)-stocks.reduce((n,f)=>n+(Number(f.qte)||0),0));if(qty===0){skipped++;return}}db.courses.push({id:id(),nom:x.nom,qte:qty,unite:x.unite||'',done:false,listId});added++});
 save();closeCoursePicker();
 alert(added+' article(s) ajouté(s). '+(skipped?skipped+' déjà disponible(s) dans le Frigo.':''));
}
function closeCoursePicker(){document.getElementById('course-picker')?.remove()}
function createCourseList(name){
 name=String(name||'').trim();if(!name)return null;
 let list={id:id(),name};db.courseLists.push(list);save();return list.id;
}
function chooseCourseList(items){
 closeCoursePicker();
 let overlay=document.createElement('div');overlay.id='course-picker';overlay.className='recipe-modal-backdrop';
 overlay.innerHTML=`<div class="recipe-modal" role="dialog" aria-modal="true" aria-label="Choisir une liste de courses"><h3>🛒 Vers quelle liste ?</h3><p class="muted">${items.length===1?esc(items[0].nom):items.length+' articles'} à ajouter</p>${db.courseLists.map(l=>`<button class="course-list-option" data-id="${esc(l.id)}">🛒 ${esc(l.name)}</button>`).join('')||'<p class="muted">Aucune liste créée.</p>'}<form id="picker-new-list"><label>Créer une nouvelle liste</label><input name="name" required maxlength="70" placeholder="Ex. Supermarché A"><p><button class="primary">Créer et ajouter</button></p></form><button class="secondary" id="picker-cancel">Annuler</button></div>`;
 document.body.appendChild(overlay);
 overlay.querySelectorAll('.course-list-option').forEach(b=>b.onclick=()=>addCourseItems(items,b.dataset.id));
 overlay.querySelector('#picker-cancel').onclick=closeCoursePicker;
 overlay.onclick=e=>{if(e.target===overlay)closeCoursePicker()};
 overlay.querySelector('#picker-new-list').onsubmit=e=>{e.preventDefault();let listId=createCourseList(new FormData(e.target).get('name'));if(listId)addCourseItems(items,listId)};
}
function courses(){
 let lists=db.courseLists;
 if(activeCourseList&&!lists.some(x=>x.id===activeCourseList))activeCourseList=null;
 if(!activeCourseList){
 app.innerHTML=`<h2>Mes listes de courses</h2><form id="create-course-list" class="card"><label>Nom de la nouvelle liste</label><input name="name" required maxlength="70" placeholder="Ex. Supermarché A"><p><button class="primary">+ Créer une liste</button></p></form>${lists.map(l=>{let count=db.courses.filter(x=>x.listId===l.id).length;return `<div class="item"><button onclick="activeCourseList='${esc(l.id)}';courses()">🛒 ${esc(l.name)} <span class="muted">(${count} article${count>1?'s':''})</span></button><button aria-label="Renommer ${esc(l.name)}" onclick="renameCourseList('${esc(l.id)}')">✏️</button><button class="danger" aria-label="Supprimer ${esc(l.name)}" onclick="deleteCourseList('${esc(l.id)}')">✕</button></div>`}).join('')||'<p class="muted">Crée une liste pour commencer.</p>'}`;
 document.getElementById('create-course-list').onsubmit=e=>{e.preventDefault();let key=createCourseList(new FormData(e.target).get('name'));if(key){activeCourseList=key;courses()}};
 return;
 }
 let list=lists.find(x=>x.id===activeCourseList),items=db.courses.filter(x=>x.listId===activeCourseList);
 app.innerHTML=`<button class="secondary" onclick="activeCourseList=null;courses()">← Toutes les listes</button><h2 style="margin-top:18px">🛒 ${esc(list.name)}</h2><form id="courseform" class="card"><label>Article</label><input name="nom" required placeholder="Ex. Œufs"><div class="grid"><div><label>Quantité</label><input name="qte" type="number" min="0" step="any" value="1"></div><div><label>Unité</label><input name="unite"></div></div><p><button class="primary">+ Ajouter à cette liste</button></p></form>${items.map(x=>`<div class="item"><label style="margin:0;flex:1;font-weight:normal;display:flex;gap:8px;align-items:center"><input type="checkbox" ${x.done?'checked':''} onchange="let a=db.courses.find(i=>i.id==='${esc(x.id)}');a.done=this.checked;save()"><span style="${x.done?'text-decoration:line-through;opacity:.6':''}">${esc(x.nom)}${x.qte==null?'':' — '+esc(x.qte)+' '+esc(x.unite)}</span></label><button aria-label="Déplacer cet article" onclick="moveCourseItem('${esc(x.id)}')">↪️</button><button class="danger" aria-label="Supprimer cet article" onclick="db.courses=db.courses.filter(i=>i.id!=='${esc(x.id)}');save();courses()">✕</button></div>`).join('')||'<p class="muted">Cette liste est vide.</p>'}`;
 document.getElementById('courseform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.courses.push({id:id(),nom:String(f.get('nom')).trim(),qte:f.get('qte')===''?null:Number(f.get('qte')),unite:String(f.get('unite')),done:false,listId:activeCourseList});save();courses()};
}
function moveCourseItem(itemId){
 let item=db.courses.find(x=>x.id===itemId);if(!item)return;
 let targets=db.courseLists.filter(x=>x.id!==item.listId);
 let overlay=document.createElement('div');overlay.id='course-picker';overlay.className='recipe-modal-backdrop';
 overlay.innerHTML=`<div class="recipe-modal" role="dialog" aria-modal="true"><h3>Déplacer ${esc(item.nom)}</h3>${targets.map(l=>`<button class="course-list-option" data-id="${esc(l.id)}">${esc(l.name)}</button>`).join('')||'<p class="muted">Aucune autre liste.</p>'}<form id="move-new-list"><label>Ou créer une liste</label><input name="name" required placeholder="Nom de la liste"><p><button class="primary">Créer et déplacer</button></p></form><button class="secondary" id="picker-cancel">Annuler</button></div>`;
 document.body.appendChild(overlay);
 let move=id=>{item.listId=id;save();closeCoursePicker();courses()};
 overlay.querySelectorAll('.course-list-option').forEach(b=>b.onclick=()=>move(b.dataset.id));
 overlay.querySelector('#move-new-list').onsubmit=e=>{e.preventDefault();let key=createCourseList(new FormData(e.target).get('name'));if(key)move(key)};
 overlay.querySelector('#picker-cancel').onclick=closeCoursePicker;
 overlay.onclick=e=>{if(e.target===overlay)closeCoursePicker()};
}
function renameCourseList(key){let l=db.courseLists.find(x=>x.id===key);if(!l)return;let name=prompt('Nouveau nom de la liste :',l.name);if(name===null||!name.trim())return;l.name=name.trim();save();courses()}
function deleteCourseList(key){let l=db.courseLists.find(x=>x.id===key);if(!l||!confirm('Supprimer la liste « '+l.name+' » et tous ses articles ?'))return;db.courseLists=db.courseLists.filter(x=>x.id!==key);db.courses=db.courses.filter(x=>x.listId!==key);save();activeCourseList=null;courses()}

function printRecipe(){let r=db.recettes.find(x=>x.id===detailId);if(!r)return;let before=document.title;document.title='Miam Miam - '+r.nom;window.print();document.title=before}
function weekStart(){let d=new Date();d.setHours(12,0,0,0);let wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd+7*weekOffset);return d}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mealGet(key,slot){return db.mealPlan.find(m=>m.date===key&&m.slot===slot)}
function mealSet(key,slot,recipeId){let old=mealGet(key,slot);if(old){old.recipeId=recipeId;old.people=old.people||1}else db.mealPlan.push({date:key,slot,recipeId,people:1});save();calendar()}
function mealPeople(key,slot,people){let m=mealGet(key,slot);if(m){m.people=Math.max(1,Math.min(6,Number(people)||1));save()}}
function mealRandom(key,slot){let k=key+'-'+slot;let excluded=mealExclusions[k]||[];let options=db.recettes.filter(r=>!excluded.includes(r.id));if(!options.length){if(confirm('Toutes les recettes ont été exclues. Recommencer le tirage ?')){mealExclusions[k]=[];mealRandom(key,slot)}return}let chosen=options[Math.floor(Math.random()*options.length)];mealSet(key,slot,chosen.id)}
function mealExclude(key,slot){let m=mealGet(key,slot);if(!m||!m.recipeId)return;let k=key+'-'+slot;mealExclusions[k]=[...(mealExclusions[k]||[]),m.recipeId];mealRandom(key,slot)}
function calendar(){app.innerHTML=`<h2>Calendrier</h2><div class="row"><button class="${calendarTab==='repas'?'primary':'secondary'}" onclick="calendarTab='repas';calendar()">Mes repas</button><button class="${calendarTab==='saisons'?'primary':'secondary'}" onclick="calendarTab='saisons';calendar()">Fruits et légumes</button></div><div id="calendar-content"></div>`;if(calendarTab==='saisons'){seasonCalendar();app.insertAdjacentHTML('afterbegin',`<h2>Calendrier</h2><div class="row"><button class="secondary" onclick="calendarTab='repas';calendar()">Mes repas</button><button class="primary" onclick="calendarTab='saisons';calendar()">Fruits et légumes</button></div>`);return}let start=weekStart(),days=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];let html=`<div class="row" style="justify-content:space-between;margin:16px 0"><button class="secondary" onclick="weekOffset--;calendar()">← Semaine précédente</button><button class="secondary" onclick="weekOffset=0;calendar()">Aujourd’hui</button><button class="secondary" onclick="weekOffset++;calendar()">Suivante →</button></div><p class="muted">14 repas sur 7 jours · 1 personne par défaut, modifiable de 1 à 6.</p><div class="meal-grid">`;for(let i=0;i<7;i++){let d=new Date(start);d.setDate(d.getDate()+i);let key=dateKey(d);html+=`<div class="meal-day">${days[i]} ${d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}</div>`;for(let slot of ['Midi','Soir']){let m=mealGet(key,slot);html+=`<div class="meal-slot"><strong>${slot}</strong><select aria-label="Recette ${slot} ${days[i]}" onchange="mealSet('${key}','${slot}',this.value)"><option value="">Choisir une recette</option>${db.recettes.slice().sort((a,b)=>a.nom.localeCompare(b.nom,'fr')).map(r=>`<option value="${r.id}" ${m?.recipeId===r.id?'selected':''}>${esc(r.nom)}</option>`).join('')}</select><div class="row"><label style="margin:0">👥 <input aria-label="Personnes" type="number" min="1" max="6" value="${m?.people||1}" onchange="mealPeople('${key}','${slot}',this.value)"></label><button class="secondary" title="Tirer une recette au hasard" onclick="mealRandom('${key}','${slot}')">🎲</button><button class="secondary" title="Exclure cette recette et retirer" onclick="mealExclude('${key}','${slot}')">↻</button></div></div>`}}html+='</div>';document.getElementById('calendar-content').innerHTML=html}

function settings(){app.innerHTML=`<h2>Réglages</h2><div class="card"><div class="theme-choice"><div><h3 style="margin:0 0 5px">Apparence</h3><p class="muted" style="margin:0">Choisis le thème de Miam Miam.</p></div><select aria-label="Mode d’affichage" id="theme-select" onchange="setTheme(this.value)"><option value="light">Clair ☀️</option><option value="dark">Sombre 🌙</option><option value="system">Automatique</option></select></div></div><div class="card"><h3>Sauvegarder les données</h3><p class="muted">Exporte tes recettes, listes et repas dans un fichier JSON.</p><button class="primary" onclick="backup()">Télécharger une sauvegarde</button></div><div class="card"><h3>Restaurer une sauvegarde</h3><input type="file" accept=".json,application/json" id="restore"></div><p class="muted">Données stockées sur cet appareil et dans ce navigateur. Effacer les données du navigateur peut les supprimer : pense à exporter régulièrement une sauvegarde.</p>`;document.getElementById('theme-select').value=localStorage.getItem('miamTheme')||'light';document.getElementById('restore').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.recettes)||!Array.isArray(d.courses))throw Error('Format incorrect');if(confirm('Remplacer toutes les données actuelles ?')){db=d;save();render()}}catch(err){alert('Sauvegarde invalide : '+err.message)}}}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='miam-miam-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function applyTheme(){let choice=localStorage.getItem('miamTheme')||'light';let dark=choice==='dark'||(choice==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('meta[name="theme-color"]').content=dark?'#251f1b':'#fff8ed'}
function setTheme(choice){localStorage.setItem('miamTheme',choice);applyTheme()}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);applyTheme();render();enableDictation(app);new MutationObserver(()=>enableDictation(app)).observe(app,{childList:true,subtree:true});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>

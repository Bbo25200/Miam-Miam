<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ed"><link rel="manifest" href="./manifest.webmanifest"><title>Miam Miam</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#35251e;background:#fff8ed}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#fff8ed;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #eadbc9;z-index:2}header strong{font-size:23px}header button{font-size:28px}button{border:0;background:transparent;cursor:pointer;color:inherit}main{padding:16px 16px 110px;max-width:650px;margin:auto}h2{margin:8px 0 15px;font-size:23px}h3{margin:22px 0 10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card{background:white;border:1px solid #e9ddce;border-radius:14px;padding:14px;margin:9px 0}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid #eee0d3}.item button:first-child{text-align:left;flex:1;font-size:16px}.muted{color:#7d7068;font-size:13px}.primary{background:#9b5437;color:white;padding:11px 15px;border-radius:10px;font-weight:650}.secondary{background:#f2e6d9;padding:10px 12px;border-radius:9px}input,select,textarea{font:inherit;padding:11px;border:1px solid #d6c7b9;border-radius:9px;min-width:0;background:white}input[type=text],input[type=number],textarea{width:100%}label{display:block;margin:12px 0 5px;font-weight:600;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5d9cb;display:grid;grid-template-columns:repeat(6,1fr);padding:9px 2px max(10px,env(safe-area-inset-bottom));z-index:2}.tabs button{font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0}.tabs .ico{font-size:22px}.tabs .active{color:#a34d2f;font-weight:bold}.hidden{display:none}.pill{display:inline-block;background:#f2e6d9;border-radius:20px;padding:4px 8px;font-size:12px}.danger{color:#b23828}.alphabet{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}.alphabet button{font-size:12px;background:#f3e7da;padding:6px;border-radius:5px}small{line-height:1.5}
</style></head><body><header><button aria-label="Accueil" onclick="go('recettes')">🍞</button><strong>Miam Miam</strong><button aria-label="Liste de courses" onclick="go('courses')">🛒</button></header><main id="app"></main><nav class="tabs" id="tabs"></nav><script>
const sections=[['recettes','👨‍🍳','Recettes'],['cocktails','🍸','Cocktails'],['epices','🌶️','Épices'],['frigo','🧊','Frigo'],['calendrier','📅','Calendrier'],['reglages','⚙️','Réglages']];
let db;try{db=JSON.parse(localStorage.getItem('miamV1')||'null')}catch(e){}
db=db||{recettes:[],cocktails:[],epices:[],frigo:[],courses:[],calendrier:[]};
let page='recettes',editId=null,filter='',selectedDay=new Date().toISOString().slice(0,10);
const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),save=()=>localStorage.setItem('miamV1',JSON.stringify(db));
function go(p){page=p;editId=null;filter='';render()}
function render(){document.getElementById('tabs').innerHTML=sections.map(([key,icon,name])=>`<button class="${page===key?'active':''}" onclick="go('${key}')"><span class="ico">${icon}</span>${name}</button>`).join('');if(page==='courses')return courses();if(page==='frigo')return fridge();if(page==='calendrier')return calendar();if(page==='reglages')return settings();catalog(page)}
function catalog(kind){let label={recettes:'Mes recettes',cocktails:'Mes cocktails',epices:'Mes épices'}[kind],items=db[kind].slice().sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));if(editId){let item=db[kind].find(x=>x.id===editId)||{nom:'',personnes:2,ingredients:[],instructions:'',origine:'',temps:''};app.innerHTML=`<button class="secondary" onclick="editId=null;render()">← Retour</button><h2>${item.id?'Modifier':'Ajouter'} — ${label}</h2><form id="editor"><label>Nom</label><input name="nom" required value="${esc(item.nom)}"><div class="grid"><div><label>Personnes</label><input name="personnes" type="number" min="1" value="${esc(item.personnes||2)}"></div><div><label>Temps (minutes)</label><input name="temps" type="number" min="0" value="${esc(item.temps)}"></div></div><label>Origine (facultatif)</label><input name="origine" value="${esc(item.origine)}"><label>Ingrédients — un par ligne : quantité ; unité ; ingrédient</label><textarea name="ingredients" rows="7" placeholder="3 ; pièce ; œuf&#10;200 ; g ; farine">${esc(item.ingredients.map(i=>`${i.qte} ; ${i.unite} ; ${i.nom}`).join('\n'))}</textarea><label>Préparation / notes</label><textarea name="instructions" rows="6">${esc(item.instructions)}</textarea><p><button class="primary" type="submit">Enregistrer</button> ${item.id?`<button type="button" class="secondary danger" onclick="removeItem('${kind}','${item.id}')">Supprimer</button>`:''}</p></form>`;document.getElementById('editor').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:item.id||id(),nom:f.get('nom').trim(),personnes:Number(f.get('personnes'))||2,temps:f.get('temps'),origine:f.get('origine'),instructions:f.get('instructions'),ingredients:f.get('ingredients').split('\n').filter(x=>x.trim()).map(line=>{let parts=line.split(';').map(x=>x.trim());return {qte:Number(parts[0].replace(',','.'))||0,unite:parts[1]||'',nom:parts.slice(2).join(';')||parts[0]}})};db[kind]=db[kind].filter(x=>x.id!==obj.id).concat(obj);save();editId=null;render()};return}
let filtered=items.filter(x=>x.nom.toLocaleLowerCase('fr').includes(filter.toLocaleLowerCase('fr')));app.innerHTML=`<h2>${label}</h2><div class="row"><button class="primary" onclick="editId='new';render()">+ Ajouter</button><span class="muted">${items.length} élément(s)</span></div><label>Rechercher</label><input id="search" placeholder="Nom..." value="${esc(filter)}"><div class="alphabet">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c=>`<button onclick="filter='${c}';render()">${c}</button>`).join('')}<button onclick="filter='';render()">Tout</button></div><div id="results">${filtered.map(x=>`<div class="item"><button onclick="editId='${x.id}';render()">${esc(x.nom)}</button><span>›</span></div>`).join('')||'<p class="muted">Aucun élément. Ajoute ta première fiche !</p>'}</div>`;document.getElementById('search').oninput=e=>{filter=e.target.value;let r=db[kind].slice().sort((a,b)=>a.nom.localeCompare(b.nom,'fr')).filter(x=>x.nom.toLocaleLowerCase('fr').includes(filter.toLocaleLowerCase('fr')));document.getElementById('results').innerHTML=r.map(x=>`<div class="item"><button onclick="editId='${x.id}';render()">${esc(x.nom)}</button><span>›</span></div>`).join('')||'<p class="muted">Aucun résultat</p>'}}
function removeItem(kind,key){if(confirm('Supprimer cette fiche ?')){db[kind]=db[kind].filter(x=>x.id!==key);save();editId=null;render()}}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/s$/,'')}
function fridge(){app.innerHTML=`<h2>Mon frigo</h2><p class="muted">Indique les quantités disponibles, puis le nombre de convives. Les recettes ayant au moins 50 % des ingrédients disponibles sont proposées.</p><form id="addfridge" class="card"><label>Ingrédient</label><input name="nom" required placeholder="Ex. tomates"><div class="grid"><div><label>Quantité</label><input name="qte" type="number" step="any" min="0" required></div><div><label>Unité</label><input name="unite" placeholder="g, ml, pièce..."></div></div><p><button class="primary">+ Ajouter au frigo</button></p></form>${db.frigo.map(x=>`<div class="item"><span>${esc(x.nom)} — ${x.qte} ${esc(x.unite)}</span><button class="danger" onclick="db.frigo=db.frigo.filter(i=>i.id!=='${x.id}');save();render()">✕</button></div>`).join('')}<label>Nombre de personnes</label><input type="number" min="1" value="2" id="people"><p><button class="primary" onclick="matchRecipes()">Trouver des recettes</button></p><div id="matches"></div>`;document.getElementById('addfridge').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.frigo.push({id:id(),nom:f.get('nom').trim(),qte:Number(f.get('qte')),unite:f.get('unite').trim()});save();render()}}
function matchRecipes(){let n=Number(document.getElementById('people').value)||2;let hits=db.recettes.map(r=>{let missing=[],found=0;for(let i of r.ingredients){let needed=i.qte*n/(r.personnes||2),stock=db.frigo.filter(x=>norm(x.nom)===norm(i.nom)&&norm(x.unite)===norm(i.unite)).reduce((s,x)=>s+x.qte,0);if(stock>=needed)found++;else missing.push({...i,qte:Math.max(0,needed-stock)})}return{r,percent:r.ingredients.length?Math.round(100*found/r.ingredients.length):0,missing}}).filter(x=>x.percent>=50).sort((a,b)=>b.percent-a.percent);document.getElementById('matches').innerHTML=`<h3>Recettes compatibles</h3>${hits.map((x,j)=>`<div class="card"><strong>${esc(x.r.nom)}</strong> <span class="pill">${x.percent} %</span><p class="muted">${x.missing.length?'Manque : '+x.missing.map(i=>`${String(Number(i.qte.toFixed(2)))} ${esc(i.unite)} ${esc(i.nom)}`).join(', '):'Tous les ingrédients sont disponibles'}</p>${x.missing.length?`<button class="secondary" onclick="addMissing(${j})">Ajouter les manquants aux courses</button>`:''}</div>`).join('')||'<p>Aucune recette ne dépasse 50 %. Ajoute des ingrédients ou des recettes.</p>'}`;window.addMissing=j=>{hits[j].missing.forEach(i=>db.courses.push({id:id(),nom:i.nom,qte:i.qte,unite:i.unite,done:false}));save();alert('Ingrédients ajoutés à la liste de courses')}}
function courses(){app.innerHTML=`<h2>Liste de courses</h2><form id="courseform" class="card"><label>Article</label><input name="nom" required><div class="grid"><div><label>Quantité</label><input name="qte" type="number" min="0" step="any" value="1"></div><div><label>Unité</label><input name="unite"></div></div><p><button class="primary">+ Ajouter</button></p></form>${db.courses.map(x=>`<div class="item"><label style="margin:0;flex:1;font-weight:normal"><input type="checkbox" ${x.done?'checked':''} onchange="let a=db.courses.find(i=>i.id==='${x.id}');a.done=this.checked;save()"> ${esc(x.nom)} — ${x.qte} ${esc(x.unite)}</label><button class="danger" onclick="db.courses=db.courses.filter(i=>i.id!=='${x.id}');save();render()">✕</button></div>`).join('')}`;document.getElementById('courseform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.courses.push({id:id(),nom:f.get('nom'),qte:Number(f.get('qte')),unite:f.get('unite'),done:false});save();render()}}
function calendar(){app.innerHTML=`<h2>Calendrier des repas</h2><label>Date</label><input type="date" id="day" value="${selectedDay}"><label>Repas prévu</label><select id="meal"><option value="">— Aucun —</option>${db.recettes.map(r=>`<option value="${r.id}" ${db.calendrier.find(x=>x.day===selectedDay)?.recipe===r.id?'selected':''}>${esc(r.nom)}</option>`).join('')}</select><p><button class="primary" onclick="db.calendrier=db.calendrier.filter(x=>x.day!==selectedDay);if(document.getElementById('meal').value)db.calendrier.push({day:selectedDay,recipe:document.getElementById('meal').value});save();render()">Enregistrer ce jour</button></p><h3>Repas planifiés</h3>${db.calendrier.slice().sort((a,b)=>a.day.localeCompare(b.day)).map(x=>`<div class="item">${x.day} — ${esc(db.recettes.find(r=>r.id===x.recipe)?.nom||'Recette supprimée')}</div>`).join('')}`;document.getElementById('day').onchange=e=>{selectedDay=e.target.value;render()}}
function settings(){app.innerHTML=`<h2>Réglages</h2><div class="card"><h3>Sauvegarder les données</h3><p class="muted">Exporte tes recettes, listes et repas dans un fichier JSON.</p><button class="primary" onclick="backup()">Télécharger une sauvegarde</button></div><div class="card"><h3>Restaurer une sauvegarde</h3><input type="file" accept=".json,application/json" id="restore"></div><p class="muted">Données stockées sur cet appareil et dans ce navigateur. Effacer les données du navigateur peut les supprimer : pense à exporter régulièrement une sauvegarde.</p>`;document.getElementById('restore').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.recettes)||!Array.isArray(d.courses))throw Error('Format incorrect');if(confirm('Remplacer toutes les données actuelles ?')){db=d;save();render()}}catch(err){alert('Sauvegarde invalide : '+err.message)}}}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='miam-miam-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>

/* Miam Miam — rafraîchissement visuel uniquement, logique inchangée */
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#352820;background:#fffaf2}
body{background:linear-gradient(180deg,#fff4df 0,#fffaf2 230px);min-height:100vh}
header{background:rgba(255,250,242,.97);border-bottom:1px solid #f0dfca;padding:15px 19px;box-shadow:0 3px 18px rgba(98,59,29,.04)}
header strong{font-size:25px;font-weight:800;letter-spacing:-.7px;color:#793c27}
header button:first-child{background:#ffebcd;border-radius:15px;width:46px;height:46px;font-size:25px}
header button:last-child{background:#fff0dc;border-radius:15px;width:46px;height:46px;font-size:23px}
main{padding:22px 18px 125px;max-width:650px}
h2{font-size:27px;letter-spacing:-.8px;color:#613724;margin:7px 0 20px}
h3{color:#74432e;font-size:18px}
.card{border:1px solid #f0e1d1;border-radius:19px;padding:18px;box-shadow:0 5px 20px rgba(91,55,27,.045)}
.item{background:#fff;border:1px solid #f1e5d7;border-radius:13px;margin:9px 0;padding:14px 13px;box-shadow:0 2px 9px rgba(91,55,27,.035)}
.item button:first-child{font-weight:600;color:#493227}
.primary{background:#a95435;color:#fff;padding:13px 18px;border-radius:13px;box-shadow:0 4px 12px rgba(169,84,53,.17)}
.secondary{background:#f7e8d7;color:#77432e;padding:12px 14px;border-radius:12px}
input,select,textarea{border:1px solid #e5d3bf;border-radius:12px;padding:13px;background:#fff;outline-color:#c98158}
label{color:#624638;font-weight:650}
.muted{color:#8a7669}
.alphabet{gap:6px;margin:13px 0 17px}
.alphabet button{background:#fff;border:1px solid #eedbc5;border-radius:9px;padding:8px 9px;color:#8b5239;font-weight:650}
.pill{background:#fff0db;color:#8e4e31;padding:5px 10px}
.tabs{background:rgba(255,255,255,.98);border-top:1px solid #f0e2d3;padding:10px 3px max(12px,env(safe-area-inset-bottom));box-shadow:0 -5px 22px rgba(73,42,20,.045)}
.tabs button{font-size:10px;color:#8e7d70;gap:5px}
.tabs .ico{font-size:23px}
.tabs .active{color:#a95435;font-weight:800}
@media(max-width:390px){main{padding-left:13px;padding-right:13px}.tabs button{font-size:9px}.tabs .ico{font-size:21px}}
/* Barre de navigation inspirée de la maquette */
.tabs{padding:9px 5px max(10px,env(safe-area-inset-bottom));gap:2px}
.tabs button{color:#45291d;font-size:10px;gap:5px;border-radius:17px;min-width:0;padding:9px 1px 7px;font-weight:500}
.tabs .ico{height:32px;display:flex;align-items:center;justify-content:center}
.tabs .ico svg{display:block;width:29px;height:29px}
.tabs button.active{background:#f59a08;color:#fff;font-weight:700}
@media(max-width:390px){.tabs button{font-size:9px}.tabs .ico svg{width:26px;height:26px}}

/* En-tête inspiré de la maquette, sans modification des fonctions */
header{display:grid;grid-template-columns:64px minmax(0,1fr) 54px;align-items:center;gap:4px;padding:12px 13px 9px;min-height:91px}
header button:first-child,header button:last-child{background:transparent;border-radius:0;width:auto;height:auto;padding:0}
header .home-logo{display:flex;align-items:center;justify-content:center;width:64px;height:69px}
header .home-logo svg{display:block;width:62px;height:68px}
header .brand-title{position:relative;text-align:center;white-space:nowrap;font-size:clamp(25px,7.4vw,38px);font-weight:900;letter-spacing:-1.6px;color:#4b210f;line-height:1.1;padding-bottom:9px}
header .brand-title:after{content:"";position:absolute;bottom:1px;left:20%;right:15%;height:5px;border-radius:80% 20% 65% 35%;background:#f39a0b;transform:rotate(-1deg)}
header .cart-logo{display:flex;align-items:center;justify-content:center;width:50px;height:56px;color:#4b210f}
header .cart-logo svg{width:43px;height:43px;display:block}
@media(max-width:370px){header{grid-template-columns:52px minmax(0,1fr) 42px;padding-left:8px;padding-right:8px}header .home-logo{width:52px}header .home-logo svg{width:51px}header .cart-logo{width:42px}header .cart-logo svg{width:38px}header .brand-title{font-size:26px}}

/* Recherche façon maquette — recettes uniquement */
.recipe-search-row{display:flex;align-items:center;gap:12px;margin:6px 0 22px}
.recipe-search-box{height:54px;flex:1;min-width:0;border:1.5px solid #cbb7a2;border-radius:32px;background:#fff;display:flex;align-items:center;padding:0 16px;gap:11px}
.recipe-search-box svg{width:23px;height:23px;flex-shrink:0;color:#777}
.recipe-search-box #search{width:100%;min-width:0;border:0;outline:0;background:transparent;padding:0;font-size:16px;box-shadow:none}
.recipe-add{width:55px;height:55px;flex-shrink:0;border-radius:50%;background:#f59a08;color:white;font-size:43px;font-weight:300;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 0 5px;box-shadow:0 3px 9px #d89a3440}
.recipe-search-box:focus-within{border-color:#f59a08}

.recipe-categories{display:flex;gap:9px;overflow-x:auto;padding:2px 1px 12px;margin:0 0 9px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.recipe-categories::-webkit-scrollbar{display:none}
.recipe-categories button{white-space:nowrap;flex-shrink:0;background:#fff0dc;color:#42271b;border-radius:22px;padding:11px 16px;font-size:14px;font-weight:600;box-shadow:0 2px 5px #8c542012}
.recipe-categories button.active{background:#f59a08;color:#fff}

/* Alphabet vertical à droite de la liste des recettes */
.recipe-list-shell{position:relative;padding-right:30px}
.recipe-list-shell .alphabet{position:fixed;right:max(6px,calc((100vw - 650px)/2 + 6px));top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;flex-wrap:nowrap;align-items:center;gap:0;margin:0;padding:3px 1px;background:rgba(255,250,242,.95);border-radius:9px;max-height:calc(100dvh - 170px);overflow-y:auto;scrollbar-width:none}
.recipe-list-shell .alphabet button{width:24px;min-height:clamp(13px,2.1dvh,19px);padding:0;border:0;border-radius:3px;background:transparent;color:#4b291c;font-size:clamp(10px,1.45dvh,13px);font-weight:650;line-height:1}
.recipe-list-shell .alphabet button:last-child{font-size:8px;min-height:19px}
.recipe-list-shell .alphabet button:active{background:#f59a08;color:#fff}
/* Colonne A-Z affinée et espace de sécurité avec les filtres */
.recipe-list-shell .alphabet{right:max(3px,calc((100vw - 650px)/2 + 3px));width:18px;padding:3px 0}
.recipe-list-shell .alphabet button{width:18px;font-size:clamp(9px,1.35dvh,12px)}
.recipe-categories{width:calc(100% - 30px);max-width:100%;margin-right:30px}
.recipe-list-shell #results{padding-right:24px}

/* Fiche recette — consultation */
.recipe-detail-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin:18px 0}.recipe-detail-head h2{margin:4px 0 8px;font-size:29px}.recipe-detail-meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 18px}.recipe-detail-meta span{background:#fff0dc;border-radius:20px;padding:7px 11px;font-size:13px;color:#71412b}.recipe-detail-card{background:#fff;border:1px solid #f0e1d1;border-radius:19px;padding:18px;margin:13px 0;box-shadow:0 4px 18px #5b371b0b}.recipe-detail-card h3{margin:0 0 14px;font-size:19px}.recipe-people{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff4e3;padding:12px;border-radius:13px}.recipe-people-controls{display:flex;align-items:center;gap:12px;font-weight:800}.recipe-people-controls button{width:34px;height:34px;background:#f59a08;color:white;border-radius:50%;font-size:24px;line-height:1}.recipe-ingredient{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #f2e8dd}.recipe-ingredient:last-child{border:0}.recipe-ingredient b{white-space:nowrap;color:#7b4029}.recipe-steps{white-space:pre-line;line-height:1.7;color:#4b372c}.recipe-detail-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.recipe-detail-actions button{flex:1;min-width:125px}

/* Éditeur de recettes */
.recipe-photo{display:block;width:100%;max-height:270px;object-fit:cover;border-radius:16px;margin:10px 0}
.recipe-editor-section{background:#fff;border:1px solid #f0e1d1;border-radius:17px;padding:15px;margin:13px 0}
.recipe-editor-section h3{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.mini-add{background:#f59a08;color:white;border-radius:50%;width:36px;height:36px;font-size:26px;line-height:1}
.editor-entry{display:flex;align-items:center;gap:8px;border-bottom:1px solid #f0e5da;padding:10px 0}
.editor-entry span{flex:1;min-width:0;overflow-wrap:anywhere}
.editor-entry button{background:#f7e8d7;border-radius:9px;padding:8px}
.recipe-modal-backdrop{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}
.recipe-modal{background:#fffaf2;border-radius:18px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.recipe-modal h3{margin-top:0}.recipe-modal select{width:100%}.recipe-modal .row{margin-top:16px}
.recipe-ingredient button{background:#fff0dc;border-radius:9px;padding:7px;font-size:20px}
.recipe-ingredient span{flex:1}.recipe-ingredient b{white-space:normal;text-align:right}
.recipe-step{display:flex;gap:12px;margin:12px 0;line-height:1.6}.recipe-step-number{flex:none;background:#f59a08;color:white;border-radius:50%;width:29px;height:29px;text-align:center;line-height:29px;font-weight:bold}
.spice-item{display:flex;align-items:center;gap:11px}
.spice-dot{width:12px;height:12px;min-width:12px;border-radius:50%;display:inline-block}
.spice-in{background:#27944b}
.spice-out{background:#dc3d3d}
.spice-item .spice-cart{flex:none;background:#fff0dc;border-radius:10px;padding:9px;font-size:20px}
.season-month{background:white;border:1px solid #f0e1d1;border-radius:14px;margin:9px 0;overflow:hidden}
.season-month-button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:17px 18px;font-size:17px;font-weight:700;color:#613724;text-align:left}
.season-content{padding:0 16px 18px;border-top:1px solid #f3e8dd}
.season-content h3{margin:18px 0 10px}
.season-tags{display:flex;flex-wrap:wrap;gap:8px}
.season-tags span{background:#fff1df;border-radius:20px;padding:8px 11px;font-size:14px}

const sections=[['recettes','👨‍🍳','Recettes'],['cocktails','🍸','Cocktails'],['epices','🌶️','Épices'],['frigo','🧊','Frigo'],['calendrier','📅','Calendrier'],['reglages','⚙️','Réglages']];
let db;try{db=JSON.parse(localStorage.getItem('miamV1')||'null')}catch(e){}
db=db||{recettes:[],cocktails:[],epices:[],frigo:[],courses:[],calendrier:[]};
let categoryFilter='Toutes';let detailId=null,detailPeople=2;let page='recettes',editId=null,filter='',selectedDay=new Date().toISOString().slice(0,10);
const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),save=()=>localStorage.setItem('miamV1',JSON.stringify(db));

function addCocktailIngredientToCourses(j){

function stepDialog(j=-1){showRecipeDialog(`<h3>${j<0?'Ajouter':'Modifier'} une étape</h3><label>Description</label><textarea name="texte" rows="5" required>${esc(recipeDraft.etapes[j]||'')}</textarea>`,f=>{let v=String(f.get('texte')).trim();if(!v)return;if(j<0)recipeDraft.etapes.push(v);else recipeDraft.etapes[j]=v;(recipeDraft.kind==='cocktails'?cocktailEditor():recipeEditor())})}
function equipmentDialog(j=-1){let known=['Four','Poêle','Air Fryer','Casserole','Robot pâtissier','Mixeur','Fouet','Saladier','Plaque de cuisson'];showRecipeDialog(`<h3>${j<0?'Ajouter':'Modifier'} du matériel</h3><label>Matériel</label><input name="texte" list="equipment-suggestions" required value="${esc(recipeDraft.materiel[j]||'')}"><datalist id="equipment-suggestions">${known.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`,f=>{let v=String(f.get('texte')).trim();if(!v)return;if(j<0)recipeDraft.materiel.push(v);else recipeDraft.materiel[j]=v;(recipeDraft.kind==='cocktails'?cocktailEditor():recipeEditor())})}
function recipeDetail(){let r=db.recettes.find(x=>x.id===detailId);if(!r){detailId=null;return catalog('recettes')}let n=Math.max(1,Math.min(6,detailPeople)),base=Number(r.personnes)||2,ingredients=Array.isArray(r.ingredients)?r.ingredients:[],steps=recipeSteps(r);let fmt=v=>String(Math.round(v*100)/100).replace('.',',');app.innerHTML=`<button class="secondary" onclick="detailId=null;render()">← Mes recettes</button>${r.photo?`<img class="recipe-photo" src="${esc(r.photo)}" alt="Photo de ${esc(r.nom)}">`:''}<div class="recipe-detail-head"><div><h2>${esc(r.nom)}</h2><div class="recipe-detail-meta"><span>${esc(r.categorie||'Plats')}</span>${r.temps?`<span>⏱ ${esc(r.temps)} min</span>`:''}${r.origine?`<span>📍 ${esc(r.origine)}</span>`:''}</div></div></div><section class="recipe-detail-card"><div class="recipe-people"><strong>👥 Nombre de personnes</strong><div class="recipe-people-controls"><button aria-label="Une personne de moins" onclick="detailPeople=Math.max(1,detailPeople-1);recipeDetail()">−</button><span>${n}</span><button aria-label="Une personne de plus" onclick="detailPeople=Math.min(6,detailPeople+1);recipeDetail()">+</button></div></div></section><section class="recipe-detail-card"><h3>🥕 Ingrédients</h3>${ingredients.length?ingredients.map((i,j)=>`<div class="recipe-ingredient"><span>${esc(i.nom)}</span><b>${fmt((Number(i.qte)||0)*n/base)} ${esc(i.unite)}</b><button aria-label="Ajouter ${esc(i.nom)} aux courses" onclick="addIngredientToCourses(${j})">🛒</button></div>`).join(''):'<p class="muted">Aucun ingrédient renseigné.</p>'}</section><section class="recipe-detail-card"><h3>👩‍🍳 Préparation</h3>${steps.length?steps.map((v,j)=>`<div class="recipe-step"><span class="recipe-step-number">${j+1}</span><span>${esc(v)}</span></div>`).join(''):'<p class="muted">Aucune étape renseignée.</p>'}</section>${Array.isArray(r.materiel)&&r.materiel.length?`<section class="recipe-detail-card"><h3>🍳 Matériel</h3>${r.materiel.map(v=>`<div class="recipe-step">${esc(v)}</div>`).join('')}</section>`:''}<div class="recipe-detail-actions"><button class="secondary" onclick="editId=detailId;recipeDraft=null;render();window.scrollTo(0,0)">✏️ Modifier</button></div>`}
function addIngredientToCourses(j){let r=db.recettes.find(x=>x.id===detailId),i=r?.ingredients?.[j];if(!i)return;let n=Math.max(1,Math.min(6,detailPeople)),qte=Math.round((Number(i.qte)||0)*n/(Number(r.personnes)||2)*100)/100;if(!confirm(`Ajouter ${String(qte).replace('.',',')} ${i.unite} ${i.nom} à la liste de courses ?`))return;db.courses.push({id:id(),nom:i.nom,qte,unite:i.unite,done:false});save();alert('Ingrédient ajouté à la liste de courses')}
function removeItem(kind,key){if(confirm('Supprimer cette fiche ?')){db[kind]=db[kind].filter(x=>x.id!==key);save();editId=null;render()}}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/s$/,'')}
function fridge(){app.innerHTML=`<h2>Mon frigo</h2><p class="muted">Indique les quantités disponibles, puis le nombre de convives. Les recettes ayant au moins 50 % des ingrédients disponibles sont proposées.</p><form id="addfridge" class="card"><label>Ingrédient</label><input name="nom" required placeholder="Ex. tomates"><div class="grid"><div><label>Quantité</label><input name="qte" type="number" step="any" min="0" required></div><div><label>Unité</label><input name="unite" placeholder="g, ml, pièce..."></div></div><p><button class="primary">+ Ajouter au frigo</button></p></form>${db.frigo.map(x=>`<div class="item"><span>${esc(x.nom)}${x.qte==null?'':' — '+x.qte+' '+esc(x.unite)}</span><button class="danger" onclick="db.frigo=db.frigo.filter(i=>i.id!=='${x.id}');save();render()">✕</button></div>`).join('')}<label>Nombre de personnes</label><input type="number" min="1" value="2" id="people"><p><button class="primary" onclick="matchRecipes()">Trouver des recettes</button></p><div id="matches"></div>`;document.getElementById('addfridge').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.frigo.push({id:id(),nom:f.get('nom').trim(),qte:Number(f.get('qte')),unite:f.get('unite').trim()});save();render()}}
function matchRecipes(){let n=Number(document.getElementById('people').value)||2;let hits=db.recettes.map(r=>{let missing=[],found=0;for(let i of r.ingredients){let needed=i.qte*n/(r.personnes||2),stock=db.frigo.filter(x=>norm(x.nom)===norm(i.nom)&&norm(x.unite)===norm(i.unite)).reduce((s,x)=>s+x.qte,0);if(stock>=needed)found++;else missing.push({...i,qte:Math.max(0,needed-stock)})}return{r,percent:r.ingredients.length?Math.round(100*found/r.ingredients.length):0,missing}}).filter(x=>x.percent>=50).sort((a,b)=>b.percent-a.percent);document.getElementById('matches').innerHTML=`<h3>Recettes compatibles</h3>${hits.map((x,j)=>`<div class="card"><strong>${esc(x.r.nom)}</strong> <span class="pill">${x.percent} %</span><p class="muted">${x.missing.length?'Manque : '+x.missing.map(i=>`${String(Number(i.qte.toFixed(2)))} ${esc(i.unite)} ${esc(i.nom)}`).join(', '):'Tous les ingrédients sont disponibles'}</p>${x.missing.length?`<button class="secondary" onclick="addMissing(${j})">Ajouter les manquants aux courses</button>`:''}</div>`).join('')||'<p>Aucune recette ne dépasse 50 %. Ajoute des ingrédients ou des recettes.</p>'}`;window.addMissing=j=>{hits[j].missing.forEach(i=>db.courses.push({id:id(),nom:i.nom,qte:i.qte,unite:i.unite,done:false}));save();alert('Ingrédients ajoutés à la liste de courses')}}
function addSpiceToCourses(key){let spice=db.epices.find(x=>x.id===key);if(!spice)return;db.courses.push({id:id(),nom:spice.nom,qte:null,unite:'',done:false});save();let b=document.activeElement;if(b&&b.classList.contains('spice-cart')){b.textContent='✓';b.setAttribute('aria-label','Ajouté aux courses');setTimeout(()=>{if(b.isConnected){b.textContent='🛒';b.setAttribute('aria-label','Ajouter '+spice.nom+' aux courses')}},1100)}}
function courses(){app.innerHTML=`<h2>Liste de courses</h2><form id="courseform" class="card"><label>Article</label><input name="nom" required><div class="grid"><div><label>Quantité</label><input name="qte" type="number" min="0" step="any" value="1"></div><div><label>Unité</label><input name="unite"></div></div><p><button class="primary">+ Ajouter</button></p></form>${db.courses.map(x=>`<div class="item"><label style="margin:0;flex:1;font-weight:normal"><input type="checkbox" ${x.done?'checked':''} onchange="let a=db.courses.find(i=>i.id==='${x.id}');a.done=this.checked;save()"> ${esc(x.nom)}${x.qte==null?'':' — '+x.qte+' '+esc(x.unite)}</label><button class="danger" onclick="db.courses=db.courses.filter(i=>i.id!=='${x.id}');save();render()">✕</button></div>`).join('')}`;document.getElementById('courseform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.courses.push({id:id(),nom:f.get('nom'),qte:Number(f.get('qte')),unite:f.get('unite'),done:false});save();render()}}

,"Potiron","Potimarron","Champignon","Poireau","Carotte","Betterave","Brocoli","Chou-fleur","Endive","Épinard"]},{"mois":"Novembre","fruits":["Pomme","Poire","Kiwi","Coing","Châtaigne","Noix"],"legumes":["Courge","Potiron","Potimarron","Poireau","Carotte","Betterave","Céleri-rave","Chou-fleur","Chou vert","Endive","Mâche","Panais"]},{"mois":"Décembre","fruits":["Pomme","Poire","Kiwi","Orange","Clémentine","Citron","Châtaigne"],"legumes":["Courge","Potiron","Poireau","Carotte","Betterave","Céleri-rave","Chou-fleur","Chou vert","Chou de Bruxelles","Endive","Mâche","Panais"]}];
let openSeasonMonth = new Date().getMonth();
function calendar(){
 app.innerHTML=`<h2>Calendrier des saisons</h2><p class="muted">Fruits et légumes de saison en France métropolitaine (repères indicatifs, selon les régions et la météo).</p><div class="season-months">${seasonalCalendar.map((entry,i)=>`<section class="season-month"><button class="season-month-button" aria-expanded="${openSeasonMonth===i}" onclick="openSeasonMonth=openSeasonMonth===${i}?-1:${i};calendar()"><span>${entry.mois}</span><span>${openSeasonMonth===i?'−':'+'}</span></button>${openSeasonMonth===i?`<div class="season-content"><h3>🍎 Fruits</h3><div class="season-tags">${entry.fruits.map(x=>`<span>${esc(x)}</span>`).join('')}</div><h3>🥕 Légumes</h3><div class="season-tags">${entry.legumes.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`:''}</section>`).join('')}</div>`;
}
function settings(){app.innerHTML=`<h2>Réglages</h2><div class="card"><h3>Sauvegarder les données</h3><p class="muted">Exporte tes recettes, listes et repas dans un fichier JSON.</p><button class="primary" onclick="backup()">Télécharger une sauvegarde</button></div><div class="card"><h3>Restaurer une sauvegarde</h3><input type="file" accept=".json,application/json" id="restore"></div><p class="muted">Données stockées sur cet appareil et dans ce navigateur. Effacer les données du navigateur peut les supprimer : pense à exporter régulièrement une sauvegarde.</p>`;document.getElementById('restore').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.recettes)||!Array.isArray(d.courses))throw Error('Format incorrect');if(confirm('Remplacer toutes les données actuelles ?')){db=d;save();render()}}catch(err){alert('Sauvegarde invalide : '+err.message)}}}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='miam-miam-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
